name: "build-test"

on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - detect_diff
jobs:

  exitcode:
    name: 'Terraform Run Local Exitcode'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./.github/workflows/data/local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: ./
        with:
          fail_on_detected_diff: 'true'

      - name: Terraform Init
        shell: bash
        run: terraform init

#      - name: Terraform Format
#        shell: bash
#        run: terraform fmt -check
#
      - name: Terraform Plan 1
        id: plan
        shell: bash
        run: | 
          terraform plan

      - name: Print Terraform Plan 1 Output
        if: always() # even if previous step failed, we want to capture the exit code
        shell: bash
        run: |
          echo "exit_code=${{ steps.plan.outputs.exitcode }}"

      - name: Terraform Plan 2 (fail)
        if: always() # even if previous step failed, we want to capture the exit code
        id: plan_fail
        shell: bash
        run: | 
          terraform plan -detailed-exitcode

      - name: Print Terraform Plan 2 Output
        if: always() # even if previous step failed, we want to capture the exit code
        shell: bash
        run: | 
          echo "exit_code=${{ steps.plan_fail.outputs.exitcode }}"
